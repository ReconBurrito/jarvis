    <circle cx="128" cy="128" r="92" stroke="#1a4459" stroke-width="16"/>
    <circle cx="128" cy="128" r="92" stroke="#5fd6ff" stroke-width="16" stroke-dasharray="390 188" transform="rotate(-90 128 128)"/>
    <circle cx="128" cy="128" r="58" stroke="#d6f2ff" stroke-width="7" stroke-dasharray="120 244" transform="rotate(-90 128 128)" opacity=".9"/>
  </g>
  <circle cx="128" cy="128" r="17" fill="#5fd6ff"/>
